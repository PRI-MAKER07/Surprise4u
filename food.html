<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?🤤</b>
    </div>
        <div class="food-selection">
      <div class="food-item">
        <img src="food/noodles.jpeg" alt="noodles" />
        <label
          ><input
            type="radio"
            name="food"
            value="noodles"
          />
          Noodles</label>
      </div>
    <div class="food-selection">
      <div class="food-item">
        <img src="food/momos.jpeg" alt="momos" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="momos"
          />
          Cute Momos</label>
      </div>
    <div class="food-selection">
      <div class="food-item">
        <img src="food/roll.jpg" alt="roll" />
        <label
          ><input
            type="radio"
            name="food"
            value="roll"
          />
          Fried Roll</label>
      </div>
      <div class="food-item">
        <img src="food/pasta.jpeg" alt="pasta" />
        <label><input type="radio" name="food" value="pasta" /> Pasta</label>
      </div>
      <div class="food-item">
        <img src="food/pizza.jpeg" alt="pizza" />
        <label><input type="radio" name="food" value="pizza" /> Pizza</label>
      </div>
      <div class="food-item">
        <img src="food/golgappe.jpg" alt="golgappe" />
        <label><input type="checkbox" name="food" value="golgappe" /> Golgappe</label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue UWU
    </button>
  </body>
</html>
